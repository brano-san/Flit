[workspace]
resolver = "3"
members = [
    "crates/flit-core",
    "crates/flit-proto",
    "crates/flit-search",
    "crates/flit-platform",
    "crates/flit-archive",
    "crates/flit-platform-windows",
    "crates/flit-platform-linux",
    "crates/flit-platform-linux-gui",
    "crates/flit",
    "crates/flit-indexd",
    "tools/flit-gen",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.87"

[workspace.dependencies]
flit-core = { path = "crates/flit-core" }
flit-proto = { path = "crates/flit-proto" }
flit-search = { path = "crates/flit-search" }
flit-platform = { path = "crates/flit-platform" }
flit-archive = { path = "crates/flit-archive" }
flit-platform-windows = { path = "crates/flit-platform-windows" }
flit-platform-linux = { path = "crates/flit-platform-linux" }
flit-platform-linux-gui = { path = "crates/flit-platform-linux-gui" }

crossbeam-channel = "0.5"
arc-swap = "1.7"
rayon = "1.10"
hashbrown = { version = "0.17", default-features = false }
memchr = "2.7"
regex = "1.11"
bumpalo = { version = "3.16", features = ["collections"] }
smallvec = "1.13"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
serde_json = "1"
tracing = "0.1"
crc32fast = "1.5"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
tracing-tracy = "0.12"
criterion = { version = "0.8", default-features = false }
windows = "0.62"
windows-core = "0.62"
libc = "0.2"
proptest = { version = "1.5", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"

[profile.bench]
inherits = "release"

[profile.dist]
inherits = "release"
debug = false
strip = true
lto = "fat"

[profile.wsl-agent]
inherits = "release"
debug = false
strip = true
