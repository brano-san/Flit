name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - run: cargo test --workspace
      - run: cargo clippy --workspace

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      - run: cargo test -p flit-core -p flit-search -p flit-platform -p flit-proto -p flit-platform-linux

  linux-gui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-x11-0 libegl1 libgles2 libgl1-mesa-dri xvfb weston imagemagick
      - run: cargo clippy --release -p flit -p flit-platform-linux -p flit-platform-linux-gui --all-targets -- -D warnings
      - run: cargo test --release -p flit -p flit-platform-linux -p flit-platform-linux-gui
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - run: FLIT_RUNS=1 bash scripts/metrics.sh
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - run: FLIT_RUNS=1 FLIT_SERVER=weston bash scripts/metrics.sh
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: flit-linux
          path: target/dist/*.tar.gz

  deps-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          status=0
          for crate in flit-core flit-proto flit-search flit-platform; do
            tree=$(cargo tree -p "$crate" -e normal,build --target all --prefix none)
            if grep '^windows' <<< "$tree"; then
              echo "::error::$crate depends on a windows crate"
              status=1
            else
              echo "$crate: no windows crates"
            fi
          done
          exit "$status"
