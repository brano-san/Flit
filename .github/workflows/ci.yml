name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: cargo build --workspace --release
      - run: cargo test --workspace
      - name: Replay parser corpora
        run: cargo test --manifest-path fuzz/Cargo.toml --locked --lib -- --test-threads=2
      - name: Clippy with warnings denied
        run: cargo clippy --workspace --all-targets -- -D warnings

  windows-dist:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - shell: pwsh
        run: |
          cargo build --profile dist -p flit -p flit-indexd
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force target/packages | Out-Null
          Compress-Archive -Path target/dist/flit.exe, target/dist/flit-indexd.exe, LICENSE, README.md -DestinationPath "target/packages/flit-$version-x86_64-windows.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: flit-windows
          path: target/packages/*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      - run: sh scripts/test-install-linux.sh
      - name: Test portable and Linux crates
        run: cargo test -p flit-core -p flit-search -p flit-platform -p flit-proto -p flit-platform-linux -p flit-indexd -p flit-archive

  linux-gui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-x11-0 libegl1 libgles2 libgl1-mesa-dri xvfb weston imagemagick fonts-noto-cjk
      - name: Clippy with warnings denied
        run: cargo clippy --release --workspace --all-targets --features flit-platform-linux/agent -- -D warnings
      - run: cargo test --release -p flit -p flit-platform-linux -p flit-platform-linux-gui
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - run: FLIT_RUNS=1 bash scripts/metrics.sh
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - run: FLIT_RUNS=1 FLIT_SERVER=weston bash scripts/metrics.sh
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: flit-linux
          path: target/packages/*.tar.gz

  linux-gui-regressions:
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-x11-0 libegl1 libgles2 libgl1-mesa-dri xvfb xauth xdotool dbus-daemon libglib2.0-bin at-spi2-core gir1.2-atspi-2.0 python3-gi
      - id: build
        run: cargo build --release -p flit
      - name: AT-SPI scenarios
        run: bash scripts/gui-a11y.sh target/release/flit
      - name: Golden screenshots
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLIT_SNAPSHOT_OUTPUT: ${{ runner.temp }}/flit-gui-snapshots
        run: xvfb-run -a cargo test --release -p flit --test gui_snapshots -- gui_snapshots --exact --ignored --test-threads=2
      - name: Actual screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gui-regressions-linux
          path: ${{ runner.temp }}/flit-gui-snapshots/
          if-no-files-found: ignore

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Audit dependencies
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          arguments: --all-features --locked
          command-arguments: -D license-exception-not-encountered
          rust-version: stable
      - name: Test architecture checks
        run: cargo test -p xtask --locked
      - name: Check dependency layers and theme colors
        run: cargo run -p xtask --locked
      - name: Check workspace formatting
        run: cargo fmt --all --check

  fuzz:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz each parser for 60 seconds
        shell: bash
        run: |
          targets=$(cargo +nightly fuzz list)
          test -n "$targets"
          status=0
          while IFS= read -r target; do
            cargo +nightly fuzz run --features fuzzing "$target" -- -max_total_time=60 -max_len=65536 -timeout=10 || status=$?
          done <<< "$targets"
          exit "$status"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, windows-dist, linux, linux-gui, quality]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: flit-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" *.zip *.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" *.zip *.tar.gz --title "Flit ${GITHUB_REF_NAME#v}" --generate-notes
          fi
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FLIT_UPDATE_KEY: ${{ secrets.FLIT_UPDATE_KEY }}
        run: |
          if [ -z "$FLIT_UPDATE_KEY" ]; then
            echo "::notice::No FLIT_UPDATE_KEY: archives are not signed and latest.json is not published"
            exit 0
          fi
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > notes.txt
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | {version: .tag_name, notes: .body}' > history.jsonl
          cargo run --quiet --release -p flit-sign -- manifest "${GITHUB_REF_NAME#v}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "https://github.com/$GH_REPO/releases/download/$GITHUB_REF_NAME" notes.txt *.zip *.tar.gz > manifest.json
          jq --slurpfile history history.jsonl --arg tag "$GITHUB_REF_NAME" '.history = ($history | map(select(.version != $tag)))' manifest.json > latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
