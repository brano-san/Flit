name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - run: cargo test --workspace
      - run: cargo clippy --workspace
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          cargo build --profile dist -p flit -p flit-indexd
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force target/packages | Out-Null
          Compress-Archive -Path target/dist/flit.exe, target/dist/flit-indexd.exe, LICENSE, README.md -DestinationPath "target/packages/flit-$version-x86_64-windows.zip"
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: flit-windows
          path: target/packages/*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      - run: cargo test -p flit-core -p flit-search -p flit-platform -p flit-proto -p flit-platform-linux

  linux-gui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-x11-0 libegl1 libgles2 libgl1-mesa-dri xvfb weston imagemagick fonts-noto-cjk
      - run: cargo clippy --release -p flit -p flit-platform-linux -p flit-platform-linux-gui --all-targets -- -D warnings
      - run: cargo test --release -p flit -p flit-platform-linux -p flit-platform-linux-gui
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - run: FLIT_RUNS=1 bash scripts/metrics.sh
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - run: FLIT_RUNS=1 FLIT_SERVER=weston bash scripts/metrics.sh
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: flit-linux
          path: target/packages/*.tar.gz

  deps-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          status=0
          for crate in flit-core flit-proto flit-search flit-platform; do
            tree=$(cargo tree -p "$crate" -e normal,build --target all --prefix none)
            if grep '^windows' <<< "$tree"; then
              echo "::error::$crate depends on a windows crate"
              status=1
            else
              echo "$crate: no windows crates"
            fi
          done
          exit "$status"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, linux-gui, deps-isolation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flit-windows
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" *.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" *.zip --title "Flit ${GITHUB_REF_NAME#v}" --generate-notes
          fi
