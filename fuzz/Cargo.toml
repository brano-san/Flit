[package]
name = "flit-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[workspace]
resolver = "3"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[lints]
workspace = true

[features]
fuzzing = ["dep:libfuzzer-sys"]

[dependencies]
flit-archive = { path = "../crates/flit-archive", default-features = false, features = ["fuzzing"] }
flit-core = { path = "../crates/flit-core", default-features = false }
flit-proto = { path = "../crates/flit-proto", default-features = false }
flit-search = { path = "../crates/flit-search", default-features = false }
libfuzzer-sys = { version = "0.4.13", default-features = false, features = ["link_libfuzzer"], optional = true }

[[bin]]
name = "ntfs"
path = "fuzz_targets/ntfs.rs"
required-features = ["fuzzing"]
test = false
doc = false
bench = false

[[bin]]
name = "transport"
path = "fuzz_targets/transport.rs"
required-features = ["fuzzing"]
test = false
doc = false
bench = false

