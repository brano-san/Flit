[package]
name = "flit"
description = "Flit file manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
profile = ["dep:tracing-tracy"]

[dependencies]
flit-archive.workspace = true
flit-core.workspace = true
flit-platform.workspace = true
flit-proto.workspace = true
flit-search.workspace = true
crossbeam-channel.workspace = true
rayon.workspace = true
serde = { workspace = true, features = ["rc"] }
postcard.workspace = true
serde_json.workspace = true
quick-xml = { version = "0.41", default-features = false }
ed25519-compact.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-tracy = { workspace = true, optional = true }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
pretty_yaml = { version = "0.6", default-features = false }
resvg = { version = "0.50", default-features = false, features = ["text", "system-fonts"] }
jpeg-decoder = { version = "0.3", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

[package.metadata.deb]
name = "flit"
maintainer = "Flit developers"
license-file = ["../../packaging/debian/copyright", "0"]
section = "utils"
priority = "optional"
extended-description = "A fast GPU-drawn file manager for Wayland and X11."
depends = "libc6 (>= 2.35), libegl1, libgles2, libxkbcommon0, libfontconfig1"
recommends = "libxkbcommon-x11-0, libwayland-client0, libwayland-egl1, xdg-utils, shared-mime-info, libturbojpeg0 | libturbojpeg"
assets = [
    ["target/release/flit", "usr/bin/", "755"],
    ["target/release/flit-indexd", "usr/bin/", "755"],
    ["../../assets/flit-indexd.service", "usr/lib/systemd/user/", "644"],
    ["../../assets/flit-indexd.socket", "usr/lib/systemd/user/", "644"],
    ["../../assets/flit.desktop", "usr/share/applications/", "644"],
    ["../../assets/flit.portal", "usr/share/xdg-desktop-portal/portals/", "644"],
    ["../../assets/org.freedesktop.impl.portal.desktop.flit.service", "usr/share/dbus-1/services/", "644"],
    ["../../assets/icon/hicolor/scalable/apps/flit.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../assets/icon/hicolor/256x256/apps/flit.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../assets/icon/hicolor/128x128/apps/flit.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["../../assets/icon/hicolor/64x64/apps/flit.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["../../assets/icon/hicolor/48x48/apps/flit.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["../../assets/icon/hicolor/32x32/apps/flit.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["../../assets/icon/hicolor/16x16/apps/flit.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
]

[package.metadata.generate-rpm]
summary = "Fast GPU-drawn file manager"
license = "MIT AND LicenseRef-UnRAR AND Bitstream-Vera"
assets = [
    { source = "target/release/flit", dest = "/usr/bin/flit", mode = "755" },
    { source = "target/release/flit-indexd", dest = "/usr/bin/flit-indexd", mode = "755" },
    { source = "../../assets/flit-indexd.service", dest = "/usr/lib/systemd/user/flit-indexd.service", mode = "644" },
    { source = "../../assets/flit-indexd.socket", dest = "/usr/lib/systemd/user/flit-indexd.socket", mode = "644" },
    { source = "../../assets/flit.desktop", dest = "/usr/share/applications/flit.desktop", mode = "644" },
    { source = "../../assets/flit.portal", dest = "/usr/share/xdg-desktop-portal/portals/flit.portal", mode = "644" },
    { source = "../../assets/org.freedesktop.impl.portal.desktop.flit.service", dest = "/usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.flit.service", mode = "644" },
    { source = "../../assets/icon/hicolor/scalable/apps/flit.svg", dest = "/usr/share/icons/hicolor/scalable/apps/flit.svg", mode = "644" },
    { source = "../../assets/icon/hicolor/256x256/apps/flit.png", dest = "/usr/share/icons/hicolor/256x256/apps/flit.png", mode = "644" },
    { source = "../../assets/icon/hicolor/48x48/apps/flit.png", dest = "/usr/share/icons/hicolor/48x48/apps/flit.png", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/flit/LICENSE", mode = "644" },
    { source = "../../packaging/licenses/UnRAR.txt", dest = "/usr/share/licenses/flit/UnRAR.txt", mode = "644" },
    { source = "../flit-platform-linux-gui/assets/LICENSE-FlitSans.txt", dest = "/usr/share/licenses/flit/LICENSE-FlitSans.txt", mode = "644" },
    { source = "../flit-platform-linux-gui/assets/LICENSE-FlitIcons.txt", dest = "/usr/share/licenses/flit/LICENSE-FlitIcons.txt", mode = "644" },
]

[package.metadata.generate-rpm.requires]
mesa-libEGL = "*"
libxkbcommon = "*"
fontconfig = "*"

[target.'cfg(windows)'.dependencies]
flit-platform-windows.workspace = true
windows = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(not(windows))'.dependencies]
flit-platform-linux-gui.workspace = true
libc.workspace = true
tar = { version = "0.4", default-features = false }

[target.'cfg(not(windows))'.dev-dependencies]
flit-platform-linux.workspace = true

[[test]]
name = "parser_process"
path = "test/parser_process.rs"

[dev-dependencies]
png = { version = "0.18", default-features = false }

[[test]]
name = "gui_snapshots"
path = "test/gui_snapshots.rs"

[lints]
workspace = true
