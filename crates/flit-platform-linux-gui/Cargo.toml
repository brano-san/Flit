[package]
name = "flit-platform-linux-gui"
description = "Linux desktop platform for Flit: Wayland and X11 window, OpenGL ES drawing, text, places and freedesktop integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
flit-core.workspace = true
flit-platform.workspace = true
flit-platform-linux.workspace = true
libc.workspace = true
glutin = { version = "0.32", default-features = false, features = ["egl", "wayland", "x11"] }
glow = "0.18"
raw-window-handle = "0.6"
swash = "0.2"
tracing.workspace = true
winit = { version = "=0.31.0-beta.4", default-features = false, features = ["wayland", "wayland-dlopen", "x11"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
png = "0.18"
x11-dl = "2.21"

[target.'cfg(target_os = "linux")'.build-dependencies]
naga = { version = "30", default-features = false, features = ["wgsl-in", "glsl-out"] }
