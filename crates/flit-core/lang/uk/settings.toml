"appearance.background" = "Кожен готовий колір має світлий і темний відтінки. Для власного кольору Flit вибирає світлий або темний текст і підбирає акцентні кольори для зручного читання."
"appearance.background_image" = "Зображення за списком файлів затемнюється, щоб було легше читати імена. Щоб прибрати зображення, залиште поле порожнім. Команда «Установити як тло Flit» у меню зображення заповнює це поле."
"appearance.tab_actions" = "Ліворуч від кнопок вікна. Тут доступні команди для нових вкладок і вікон, панелей, мінівікна й повноекранного режиму."
"appearance.ops_button" = "Праворуч від адресного рядка. Після невдалої операції кнопка залишається видимою, доки ви не відкриєте панель операцій."
"appearance.status_bar" = "Рядок стану з’являється для повідомлень. Alt+R показує розміри папок. Команди для Кошика й імен в архіві доступні в палітрі команд."
"appearance.window_title" = "У режимі «Flit» кнопки вікна розташовані на панелі вкладок. У режимі «Системний» віконний менеджер малює заголовок і рамку, як у KDE Plasma або на X11. Цей режим недоступний, наприклад, у GNOME на Wayland."
