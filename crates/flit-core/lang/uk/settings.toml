"general.startup_pages" = "Під час запуску кожна задана папка або сторінка «Головна» відкривається в окремій вкладці."
"advanced.default_manager" = "Win+E відкриває Flit. Папки, відкриті з робочого столу або інших програм, також відкриваються у Flit. Панель керування та інші системні папки й далі відкриваються в Провіднику. Змінюються лише ваші параметри користувача. Flit зберігає попередні значення й відновлює їх після вимкнення. Вимкніть цей параметр перед видаленням Flit."
"advanced.default_manager_linux" = "Flit стає типовою програмою для відкриття папок і відповідає на запити середовища робочого столу до файлового менеджера. Папки з робочого столу та інших програм відкриваються у Flit. Змінюються лише ваші параметри користувача. Flit зберігає попередні значення й відновлює їх після вимкнення. Вимкніть цей параметр перед видаленням Flit."
"advanced.quick_access_sync" = "Синхронізує закріплення папок між Flit і «Швидким доступом» Провідника. Після ввімкнення Flit додає відсутні папки зі «Швидкого доступу» в кінець списку закладок і закріплює свої закладки в Провіднику. Синхронізуються лише папки на дисках із літерою. Порядок залишається окремим."
"updates.check_on_start" = "Flit перевіряє наявність оновлень один раз під час запуску й повідомляє, лише якщо є нова версія. Для перевірки Flit запитує файл latest.json на GitHub і не надсилає даних про вас."
"updates.skipped" = "Flit більше не пропонує цю версію під час запуску. Вона доступна через «Перевірити оновлення»."
"advanced.indexing" = "Flit індексує імена на всіх дисках, щоб знаходити файли за мілісекунди. Якщо вимкнути індексування, Flit припинить фонове сканування дисків і звільнить пам’ять індексу. Ctrl+Shift+F і далі шукатиме безпосередньо у відкритій папці."
"keys" = "Сполучення клавіш, що відрізняються від стандартних, за ідентифікатором команди"
"area_color" = "Значення «За замовчуванням» використовує колір тла. Для власного кольору Flit автоматично підбирає колір тексту для зручного читання."
"general.mru_tabs" = "Ctrl+Tab перемикає вкладки за часом останнього використання. Вимкніть цей параметр, щоб перемикатися в порядку вкладок на панелі."
"advanced.search_exclusions" = "Приховує ці шляхи та їхній вміст у результатах пошуку."

