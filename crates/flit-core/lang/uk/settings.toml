"files.size_units" = "Одиниці розміру в списку, рядку стану, панелі попереднього перегляду й панелі операцій."
"files.archive_format" = "Початковий формат для команди «Додати до архіву…»."
"files.builtin_archives" = "Якщо вимкнути цей параметр, архіви відкриватимуться в програмі, вибраній у системі, наприклад у 7-Zip. Команди Flit «Стиснути» й «Розпакувати» буде приховано, а решта параметрів архівів стане неактивною."
"files.builtin_archives_linux" = "Якщо вимкнути цей параметр, архіви відкриватимуться в програмі, вибраній у системі, наприклад у File Roller або Ark. Команди Flit «Стиснути» й «Розпакувати» буде приховано, а решта параметрів архівів стане неактивною."
"files.archives_as_folders" = "Якщо вимкнути цей параметр, архіви відкриватимуться в програмі, вибраній у системі, наприклад у 7-Zip. Уміст архіву й далі можна переглянути через «Відкрити як папку» в контекстному меню."
"files.archives_as_folders_linux" = "Якщо вимкнути цей параметр, архіви відкриватимуться в програмі, вибраній у системі, наприклад у File Roller або Ark. Уміст архіву й далі можна переглянути через «Відкрити як папку» в контекстному меню."
"layout.same_for_all" = "Якщо вимкнути цей параметр, Flit зберігатиме макет, сортування, групування й стовпці окремо для кожної папки."
"layout.default_layout" = "Для папок без власного подання. Макет «Адаптивний» недоступний, коли всі папки мають спільне подання."
