"general.home_recent_linux" = "Dateien aus der Liste zuletzt verwendeter Dateien der Desktop-Umgebung"
"general.shell_submenu" = "Windows-eigene Befehle wie „Senden an“ und „Öffnen mit“ stehen unter „Weitere Optionen anzeigen“. Befehle von Programmen wie 7-Zip oder VS Code bleiben im Menü. Umschalt+Rechtsklick zeigt alle Befehle."
"general.menu_open_tab" = "Für Ordner"
"general.menu_open_window" = "Für Ordner"
"general.menu_copy_path" = "Kopiert die vollständigen Pfade der ausgewählten Elemente"
"general.menu_shortcut" = "Erstellt Verknüpfungen neben den ausgewählten Elementen"
"general.menu_link" = "Erstellt Links neben den ausgewählten Elementen"
"general.menu_new_folder_with_selection" = "Verschiebt die ausgewählten Elemente in einen neuen Ordner"
"general.menu_stream" = "Für eine einzelne ausgewählte Datei"
"general.menu_panes" = "„Rechts teilen“, „Unten teilen“, „Im Bereich rechts öffnen“ und „Im Bereich unten öffnen“"
"general.menu_pin" = "Für Ordner"
"general.menu_terminal" = "Für Ordner und den Ordnerhintergrund"
"general.menu_tags" = "Für Elemente auf lokalen NTFS-Laufwerken"
"general.menu_tags_linux" = "Für Elemente auf lokalen Laufwerken"
"general.menu_compress" = "Archivbefehle für die ausgewählten Elemente"
"appearance.background" = "Jede Vorgabe hat einen hellen und einen dunklen Farbton. Bei einer eigenen Farbe wählt Flit automatisch hellen oder dunklen Text und passt die Akzentfarben für gute Lesbarkeit an."
"appearance.background_image" = "Hintergrundbild für die Dateiliste. Flit dunkelt es ab, damit Namen lesbar bleiben. Lassen Sie das Feld für einen Hintergrund ohne Bild leer. „Als Flit-Hintergrund festlegen“ im Kontextmenü eines Bildes trägt den Pfad ein."
"appearance.tab_actions" = "Links neben den Fensterschaltflächen finden Sie Befehle für neue Tabs und Fenster, Bereiche, Minifenster und Vollbild."
"appearance.ops_button" = "Die Schaltfläche steht rechts neben der Adressleiste. Nach einem fehlgeschlagenen Vorgang bleibt sie sichtbar, bis Sie die Vorgangsliste öffnen."
"appearance.status_bar" = "Bei Meldungen erscheint die Statusleiste weiterhin. Alt+R zeigt Ordnergrößen an. Befehle für den Papierkorb und Archivnamen finden Sie in der Befehlspalette."
"appearance.window_title" = "Bei „Flit“ stehen die Fensterschaltflächen in der Tableiste. Bei „System“ zeichnet der Fenstermanager Titelleiste und Rahmen selbst, etwa unter KDE Plasma oder X11. Diese Option ist beispielsweise unter GNOME mit Wayland nicht verfügbar."
"files.dotfiles" = "Dateien mit einem Punkt am Namensanfang, wie sie Linux und Entwicklungswerkzeuge verwenden."
"files.streams" = "NTFS-Datenströme erscheinen im Format „Name:Datenstrom“ und lassen sich nur ansehen."
"files.hover_select" = "Ruht der Zeiger 0,6 s auf einer Zeile, wird sie ausgewählt"
"files.spring_delay" = "Halten Sie ein gezogenes Element so lange über einem Ordner, Tab, Pfadsegment oder eingeklappten Abschnitt der Seitenleiste, um das Ziel zu öffnen. „Aus“ deaktiviert das Öffnen."
"files.single_click_files" = "Klicks mit Strg oder Umschalt wählen weiterhin nur aus."
"files.single_click_folders" = "Klicks mit Strg oder Umschalt wählen weiterhin nur aus."
"files.single_click_columns" = "Nur im Layout „Spalten“"
"files.folders_in_new_tab" = "Doppelklick oder Enter öffnet den ausgewählten Ordner in einem neuen Tab."
"files.select_previous" = "Nach dem Wechsel zum übergeordneten Ordner oder zurück wird der verlassene Ordner ausgewählt und in den sichtbaren Bereich der Liste gescrollt."
"files.confirm_delete" = "Flit fragt vor dem Leeren des Papierkorbs immer nach."
"files.warn_extension" = "Erneutes Drücken von Enter übernimmt den neuen Namen."
"files.conflicts" = "Legt fest, was beim Kopieren oder Verschieben geschieht, wenn es am Ziel bereits ein Element mit demselben Namen gibt."
"files.size_units" = "Größen in der Liste, der Statusleiste, dem Vorschaubereich und dem Vorgangsbereich"
"files.archive_format" = "Vorgabe für „Zum Archiv hinzufügen…“."
"files.builtin_archives" = "Bei deaktivierter Option werden Archive in der Standardanwendung des Systems geöffnet, beispielsweise in 7-Zip. Flits Befehle „Komprimieren“ und „Entpacken“ sind dann ausgeblendet und die übrigen Archiveinstellungen inaktiv."
"files.builtin_archives_linux" = "Bei deaktivierter Option werden Archive in der Standardanwendung des Systems geöffnet, beispielsweise in File Roller oder Ark. Flits Befehle „Komprimieren“ und „Entpacken“ sind dann ausgeblendet und die übrigen Archiveinstellungen inaktiv."
"files.archives_as_folders" = "Bei deaktivierter Option werden Archive in der Standardanwendung des Systems geöffnet, beispielsweise in 7-Zip. „Als Ordner öffnen“ im Kontextmenü zeigt weiterhin den Inhalt an."
"files.archives_as_folders_linux" = "Bei deaktivierter Option werden Archive in der Standardanwendung des Systems geöffnet, beispielsweise in File Roller oder Ark. „Als Ordner öffnen“ im Kontextmenü zeigt weiterhin den Inhalt an."
"layout.same_for_all" = "Bei deaktivierter Option speichert Flit Layout, Sortierung, Gruppierung und Spalten für jeden Ordner einzeln."
"layout.default_layout" = "Für Ordner ohne eigene Ansicht; „Adaptiv“ ist nicht verfügbar, solange alle Ordner eine Ansicht teilen"
"layout.default_sort" = "Für Ordner ohne eigene Ansicht"
"layout.default_descending" = "Für Ordner ohne eigene Ansicht"
"layout.default_folders" = "Position der Ordner beim Sortieren in Ordnern ohne eigene Ansicht."
"layout.default_group" = "Für Ordner ohne eigene Ansicht"
"layout.column_modified" = "Im Layout „Details“ von Ordnern ohne eigene Ansicht"
"layout.column_created" = "Im Layout „Details“ von Ordnern ohne eigene Ansicht"
"layout.column_type" = "Im Layout „Details“ von Ordnern ohne eigene Ansicht"
"layout.column_size" = "Im Layout „Details“ von Ordnern ohne eigene Ansicht"
"layout.column_tags" = "Im Layout „Details“ von Ordnern ohne eigene Ansicht"
"layout.auto_fit" = "Passt die Spaltenbreite beim Laden eines Ordners an dessen Inhalt an."
"advanced.flatten_in_menu" = "Verschiebt die Dateien aller Unterordner in den ausgewählten Ordner und löscht die geleerten Unterordner. Strg+Z macht den Vorgang rückgängig."
"advanced.log_level" = "%LOCALAPPDATA%\\Flit\\logs; niemals Dateiinhalte oder Kennwörter"
"advanced.log_level_linux" = "~/.local/state/flit/logs; niemals Dateiinhalte oder Kennwörter"
"general.startup_pages" = "Öffnet die angegebenen Ordner oder die Startseite beim Start jeweils in einem eigenen Tab."
"advanced.default_manager" = "Win+E sowie Ordneraufrufe vom Desktop oder aus anderen Programmen öffnen Flit. Die Systemsteuerung und andere Systemordner öffnen sich weiterhin im Datei-Explorer. Nur Ihre Benutzereinstellungen ändern sich. Flit sichert die bisherigen Einstellungen und stellt sie beim Ausschalten wieder her. Deaktivieren Sie die Option, bevor Sie Flit entfernen."
"advanced.default_manager_linux" = "Flit wird zur Standardanwendung für Ordner und beantwortet die Dateimanager-Anfragen der Desktop-Umgebung. Vom Desktop oder aus anderen Programmen aufgerufene Ordner öffnen sich damit in Flit. Nur Ihre Benutzereinstellungen ändern sich. Flit sichert die bisherigen Einstellungen und stellt sie beim Ausschalten wieder her. Deaktivieren Sie die Option, bevor Sie Flit entfernen."
"advanced.quick_access_sync" = "Gleicht angeheftete Ordner zwischen Flit und dem Schnellzugriff des Datei-Explorers ab. Beim Einschalten hängt Flit fehlende Schnellzugriff-Ordner an seine Lesezeichenliste an und heftet seine Lesezeichen im Explorer an. Der Abgleich gilt für Ordner auf Laufwerken mit Laufwerksbuchstaben. Die Reihenfolge bleibt unabhängig."
"updates.check_on_start" = "Flit prüft beim Start einmal, ob es eine neue Version gibt, und meldet sich nur in diesem Fall. Dazu fragt Flit die Datei latest.json bei GitHub ab und sendet keine Benutzerdaten."
"updates.skipped" = "Flit bietet diese Version beim Start nicht mehr an. Über „Nach Updates suchen“ bleibt sie verfügbar."
"advanced.indexing" = "Ein Index der Namen auf allen Laufwerken ermöglicht eine Suche in Millisekunden. Bei deaktivierter Indizierung liest Flit die Laufwerke nicht im Hintergrund und gibt den Speicher für den Index frei. Strg+Umschalt+F durchsucht weiterhin den geöffneten Ordner direkt."
"keys" = "Vom Standard abweichende Tastenkombinationen nach Befehls-ID."
"area_color" = "„Standard“ folgt der Hintergrundfarbe; Text auf einer benutzerdefinierten Farbe passt sich an, um lesbar zu bleiben"
"general.mru_tabs" = "Mit Strg+Tab durch zuletzt verwendete Tabs wechseln. Ohne diese Option gilt die Reihenfolge der Tableiste."
"advanced.search_exclusions" = "Blendet diese Pfade und ihre Inhalte in Suchergebnissen aus."

