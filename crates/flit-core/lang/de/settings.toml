[help]
"general.language" = "Sprache für Menüs, Dialoge, Meldungen und Datumsangaben. Protokolle bleiben auf Englisch."
"general.open_in_running" = "Bei deaktivierter Option öffnet Flit Ordner aus anderen Apps oder der Befehlszeile in einem neuen Fenster."
"general.switch_to_new_tab" = "Bei deaktivierter Option öffnet Flit neue Tabs aus der Dateiliste, der Seitenleiste oder der Startseite im Hintergrund."
"general.smooth_scroll" = "Animiert das Scrollen in der Dateiliste, damit sie nicht springt."
"general.tab_wheel_reversed" = "Wer über der Tableiste nach unten scrollt, wechselt zum vorherigen Tab."
"general.date_format" = "Wie Datumsangaben in der Liste, in Suchergebnissen, im Vorschaubereich und in Dialogen angezeigt werden"
"general.home_quick_access" = "Angeheftete und bekannte Ordner als Karten"
