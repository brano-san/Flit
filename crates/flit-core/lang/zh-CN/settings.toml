"layout.default_group" = "适用于未自定义视图的文件夹"
"layout.column_modified" = "适用于未自定义视图的文件夹中的“详细信息”布局"
"layout.column_created" = "适用于未自定义视图的文件夹中的“详细信息”布局"
"layout.column_type" = "适用于未自定义视图的文件夹中的“详细信息”布局"
