"appearance.background" = "每种预设都有浅色和深色两种色调。使用自定义背景色时，Flit 会选择浅色或深色文字，并调整强调色以保持清晰。"
"appearance.background_image" = "图片会在文件列表后方调暗显示，以便看清文件名。留空则不显示图片。点击图片菜单中的“设置为 Flit 背景”可自动填写路径。"
"appearance.tab_actions" = "位于窗口按钮左侧，提供新建标签页、新建窗口、窗格、迷你窗口和全屏操作。"
"appearance.ops_button" = "位于地址栏右侧。操作失败后，按钮会一直显示，直到打开操作窗格。"
"appearance.status_bar" = "有消息时仍会显示状态栏。Alt+R 可显示文件夹大小。回收站和压缩包内名称的命令仍可在命令面板中使用。"
"appearance.window_title" = "选择“Flit”时，窗口按钮显示在标签栏中。选择“系统”时，由窗口管理器绘制标题栏和边框，例如 KDE Plasma 或 X11。窗口管理器不支持此功能时（例如 Wayland 上的 GNOME），此选项不可用。"
"files.dotfiles" = "Linux 和开发工具常用的名称以点开头的文件。"
"files.streams" = "NTFS 数据流以“名称:流”的格式单独显示，仅供查看。"
"files.hover_select" = "鼠标指针在一行上停留 0.6 秒后会选中该行。"
"files.spring_delay" = "拖动项目时，在文件夹、标签页、路径层级或侧边栏中已折叠的分区上停留指定时间，即可打开目标。选择“关闭”可停用自动打开。"
"files.single_click_files" = "按住 Ctrl 或 Shift 单击只会选中项目。"
"files.single_click_folders" = "按住 Ctrl 或 Shift 单击只会选中项目。"
"files.single_click_columns" = "仅在分栏布局中"
"files.folders_in_new_tab" = "双击列表中的文件夹，或选中文件夹后按 Enter，即可在新标签页中打开。"
"files.select_previous" = "返回上一级或后退后，Flit 会选中刚离开的文件夹，并滚动列表使该文件夹可见。"
"files.confirm_delete" = "清空回收站前始终要求确认。"
"files.warn_extension" = "再次按 Enter 即可应用新名称。"
"files.conflicts" = "目标位置已有同名项目时，复制和移动的处理方式"
"files.size_units" = "列表、状态栏、预览窗格和操作窗格中显示的大小单位。"
"files.archive_format" = "“添加到压缩包…”使用的初始格式。"
"files.builtin_archives" = "关闭此选项后，压缩包会使用系统指定的应用（例如 7-Zip）打开。Flit 自带的“压缩”和“解压”命令会隐藏，其他压缩包设置也将停用。"
"files.builtin_archives_linux" = "关闭此选项后，压缩包会使用系统指定的应用（例如 File Roller 或 Ark）打开。Flit 自带的“压缩”和“解压”命令会隐藏，其他压缩包设置也将停用。"
"files.archives_as_folders" = "关闭此选项后，压缩包会使用系统指定的应用（例如 7-Zip）打开。仍可通过上下文菜单中的“作为文件夹打开”查看内容。"
"files.archives_as_folders_linux" = "关闭此选项后，压缩包会使用系统指定的应用（例如 File Roller 或 Ark）打开。仍可通过上下文菜单中的“作为文件夹打开”查看内容。"
"layout.same_for_all" = "关闭此选项后，每个文件夹会保留各自的布局、排序、分组和列设置。"
"layout.default_layout" = "适用于未自定义视图的文件夹。所有文件夹共用视图时，无法使用“自适应”布局。"
