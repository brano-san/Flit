"layout.column_tags" = "适用于未自定义视图的文件夹中的“详细信息”布局"
"layout.auto_fit" = "每次加载文件夹时根据内容调整列宽。"
"advanced.flatten_in_menu" = "将所有子文件夹中的文件移到所选文件夹，再删除已清空的子文件夹。按 Ctrl+Z 可撤消操作。"
"advanced.log_level" = "%LOCALAPPDATA%\\Flit\\logs；从不记录文件内容或密码"
"advanced.log_level_linux" = "~/.local/state/flit/logs；从不记录文件内容或密码"
"general.startup_pages" = "启动时，将指定的文件夹或主页分别在独立的标签页中打开。"
"advanced.default_manager" = "按 Win+E，或从桌面和其他程序打开文件夹时，会使用 Flit。控制面板等系统文件夹仍通过文件资源管理器打开。仅更改当前用户的设置。Flit 会保存原有设置，并在关闭此选项时恢复。删除 Flit 前请先关闭此选项。"
"advanced.default_manager_linux" = "Flit 会成为打开文件夹的默认应用，并响应桌面环境的文件管理器请求。从桌面或其他程序打开的文件夹将显示在 Flit 中。仅更改当前用户的设置。Flit 会保存原有设置，并在关闭此选项时恢复。删除 Flit 前请先关闭此选项。"
"advanced.quick_access_sync" = "在 Flit 或文件资源管理器的快速访问中固定或取消固定文件夹，会同步到另一处。启用时，会将 Flit 未收录的快速访问文件夹添加到书签末尾，并将 Flit 书签中的文件夹固定到快速访问。仅同步带盘符的驱动器上的文件夹，顺序各自保留。"
"updates.check_on_start" = "每次启动时检查一次更新，仅在有新版本时提示。检查只向 GitHub 请求 latest.json，不会发送用户信息。"
"updates.skipped" = "启动时不再提示此版本。仍可手动选择“检查更新”查看。"
"advanced.indexing" = "Flit 会为所有驱动器中的文件名建立索引，使搜索能在几毫秒内找到文件。关闭索引后，Flit 会停止在后台扫描驱动器，并释放索引占用的内存。按 Ctrl+Shift+F 仍可直接搜索当前打开的文件夹。"
"keys" = "与默认值不同的快捷键，按命令 ID 列出"
"area_color" = "选择“默认”时使用背景色。使用自定义颜色时，文字颜色会自动调整以保持清晰。"
"general.mru_tabs" = "按 Ctrl+Tab 可按最近使用的顺序切换标签页。关闭此选项后按标签栏顺序切换。"
"advanced.search_exclusions" = "在搜索结果中隐藏这些路径及其内容。"
"files.copy_path_quotes" = "控制是否为复制的路径添加双引号。默认情况下，Flit 在 Windows 上添加引号，在 Linux 上省略引号。"

