selection_boxes = "Toggle visibility of checkboxes when selecting multiple items in a panel."
single_click = "Open items with a single click."
double_click_up = "Go to parent folder by double clicking background."
scroll_beyond = "Allows scrolling past the last item for extra space."
reverse_scroll = "Reverses the scroll direction in scrollable views."
char_key = "Determines the action when you press raw character keys without modifiers."
