show_system = "Toggle the visibility of system files."
asset_cache = "Defines the maximum memory used for icons, thumbnails, and previews."
load_thumbnails = "Criteria for loading thumbnails of listed directories."
store_recents = "Determines how recently accessed files are stored."
tooltips = "Show tooltips when hovering over files, folders and interface elements."
