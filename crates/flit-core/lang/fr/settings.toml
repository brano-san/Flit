[help]
"general.language" = "Langue des menus, des boîtes de dialogue, des messages et des dates. Les journaux restent en anglais."
"general.open_in_running" = "Si l’option est désactivée, Flit ouvre dans une nouvelle fenêtre les dossiers lancés depuis une autre application ou depuis la ligne de commande."
"general.switch_to_new_tab" = "Si l’option est désactivée, les dossiers ouverts dans des onglets depuis la liste, la barre latérale ou la page d’accueil restent en arrière-plan."
"general.smooth_scroll" = "Fluidifie les déplacements dans la liste des fichiers."
"general.tab_wheel_reversed" = "Faire défiler la barre d’onglets vers le bas sélectionne l’onglet précédent."
"general.date_format" = "Comment les dates s’affichent dans la liste, les résultats de recherche, le volet d’aperçu et les boîtes de dialogue"
"general.home_quick_access" = "Dossiers épinglés et dossiers connus sous forme de cartes"
"general.home_drives" = "Lecteurs et espace libre sur chacun"
"general.home_tags" = "Une carte pour chaque balise"
"general.home_recent" = "Fichiers et dossiers récemment ouverts, d’après l’historique de Windows"
"general.home_recent_linux" = "Fichiers ouverts récemment, d’après la liste tenue par l’environnement de bureau"
"general.shell_submenu" = "Les commandes de Windows, comme « Envoyer vers » et « Ouvrir avec », passent dans « Afficher plus d’options ». Celles ajoutées par des programmes comme 7-Zip ou VS Code restent dans le menu. Maj+clic droit affiche toutes les commandes."
"general.menu_open_tab" = "Pour les dossiers"
"general.menu_open_window" = "Pour les dossiers"
"general.menu_copy_path" = "Copie les chemins complets des éléments sélectionnés"
"general.menu_shortcut" = "Crée des raccourcis à côté des éléments sélectionnés"
"general.menu_link" = "Crée des liens à côté des éléments sélectionnés"
"general.menu_new_folder_with_selection" = "Déplace les éléments sélectionnés dans un nouveau dossier"
"general.menu_stream" = "Pour un seul fichier sélectionné"
"general.menu_panes" = "« Scinder à droite », « Scinder en bas », « Ouvrir dans un volet à droite » et « Ouvrir dans un volet en bas »"
"general.menu_pin" = "Pour les dossiers"
"general.menu_terminal" = "Pour les dossiers et les zones vides de la liste"
"general.menu_tags" = "Pour les éléments des lecteurs NTFS locaux"
"general.menu_tags_linux" = "Pour les éléments des lecteurs locaux"
"general.menu_compress" = "Commandes d’archive pour les éléments sélectionnés"
"appearance.background" = "Chaque couleur prédéfinie a une nuance claire et une nuance sombre. Avec une couleur personnalisée, Flit choisit un texte clair ou sombre et adapte les couleurs d’accentuation pour préserver la lisibilité."
"appearance.background_image" = "Image atténuée derrière la liste des fichiers pour que les noms restent lisibles. Laissez ce champ vide pour désactiver l’image. La commande « Définir comme arrière-plan de Flit » dans le menu d’une image renseigne son chemin."
"appearance.tab_actions" = "À gauche des boutons de la fenêtre. Donne accès aux commandes des nouveaux onglets, des nouvelles fenêtres, des volets, de la mini-fenêtre et du plein écran."
"appearance.ops_button" = "À droite de la barre d’adresse. Après l’échec d’une opération, le bouton reste visible jusqu’à l’ouverture du volet des opérations."
"appearance.status_bar" = "La barre d’état s’affiche pour les messages. Alt+R affiche la taille des dossiers. Les commandes de la Corbeille et des noms d’archive restent accessibles dans la palette de commandes."
"appearance.window_title" = "Avec « Flit », les boutons de la fenêtre se trouvent dans la barre d’onglets. Avec « Système », le gestionnaire de fenêtres dessine le cadre et la barre de titre, comme sous KDE Plasma ou X11. Cette option est indisponible notamment sous GNOME avec Wayland."
"files.dotfiles" = "Fichiers dont le nom commence par un point, utilisés sous Linux et par les outils de développement."
"files.streams" = "Les flux de données NTFS apparaissent sur des lignes au format « nom:flux » et peuvent uniquement être consultés."
"files.hover_select" = "Une ligne est sélectionnée lorsque le pointeur reste dessus pendant 0,6 s."
"files.spring_delay" = "Pendant le glisser-déposer, maintenez les éléments au-dessus d’un dossier, d’un onglet, d’un segment du chemin ou d’une section repliée de la barre latérale pendant ce délai pour ouvrir la cible. « Désactivé » supprime l’ouverture automatique."
"files.single_click_files" = "Cliquer en maintenant Ctrl ou Maj sélectionne sans ouvrir."
"files.single_click_folders" = "Cliquer en maintenant Ctrl ou Maj sélectionne sans ouvrir."
"files.single_click_columns" = "Uniquement dans la disposition Colonnes"
"files.folders_in_new_tab" = "Double-cliquez sur un dossier de la liste ou sélectionnez-le puis appuyez sur Entrée pour l’ouvrir dans un nouvel onglet."
"files.select_previous" = "Lorsque vous remontez d’un niveau ou revenez en arrière, Flit sélectionne le dossier quitté et le ramène dans la partie visible de la liste."
"files.confirm_delete" = "Vider la Corbeille demande toujours confirmation"
"files.warn_extension" = "Appuyez à nouveau sur Entrée pour appliquer le nouveau nom."
"files.conflicts" = "Détermine le comportement lors d’une copie ou d’un déplacement si un élément porte déjà ce nom à destination."
"files.size_units" = "Unités utilisées dans la liste, la barre d’état, le volet d’aperçu et le volet des opérations."
"files.archive_format" = "Format initial de la commande « Ajouter à l’archive… »"
"files.builtin_archives" = "Si l’option est désactivée, les archives s’ouvrent dans l’application définie par le système, par exemple 7-Zip. Les commandes « Compresser » et « Extraire » de Flit sont masquées et les autres paramètres d’archive deviennent inactifs."
"files.builtin_archives_linux" = "Si l’option est désactivée, les archives s’ouvrent dans l’application définie par le système, par exemple File Roller ou Ark. Les commandes « Compresser » et « Extraire » de Flit sont masquées et les autres paramètres d’archive deviennent inactifs."
"files.archives_as_folders" = "Si l’option est désactivée, les archives s’ouvrent dans l’application définie par le système, par exemple 7-Zip. La commande « Ouvrir comme un dossier » du menu contextuel affiche toujours leur contenu."
"files.archives_as_folders_linux" = "Si l’option est désactivée, les archives s’ouvrent dans l’application définie par le système, par exemple File Roller ou Ark. La commande « Ouvrir comme un dossier » du menu contextuel affiche toujours leur contenu."
"layout.same_for_all" = "Si l’option est désactivée, chaque dossier mémorise sa disposition, son tri, son regroupement et ses colonnes."
"layout.default_layout" = "Pour les dossiers sans affichage personnalisé. La disposition « Adaptative » est indisponible lorsque tous les dossiers partagent le même affichage."
"layout.default_sort" = "Pour les dossiers sans affichage propre"
"layout.default_descending" = "Pour les dossiers sans affichage propre"
"layout.default_folders" = "Place des dossiers lors du tri, pour les dossiers sans affichage propre"
"layout.default_group" = "Pour les dossiers sans affichage propre"
"layout.column_modified" = "Dans la disposition Détails des dossiers sans affichage propre"
"layout.column_created" = "Dans la disposition Détails des dossiers sans affichage propre"
"layout.column_type" = "Dans la disposition Détails des dossiers sans affichage propre"
"layout.column_size" = "Dans la disposition Détails des dossiers sans affichage propre"
"layout.column_tags" = "Dans la disposition Détails des dossiers sans affichage propre"
"layout.auto_fit" = "La largeur des colonnes s’ajuste à leur contenu à chaque chargement d’un dossier."
"advanced.flatten_in_menu" = "Déplace les fichiers de tous les sous-dossiers dans le dossier sélectionné, puis supprime les sous-dossiers vidés. Ctrl+Z annule l’opération."
"advanced.log_level" = "%LOCALAPPDATA%\\Flit\\logs ; jamais le contenu des fichiers ni les mots de passe"
"advanced.log_level_linux" = "~/.local/state/flit/logs ; jamais le contenu des fichiers ni les mots de passe"
"general.startup_pages" = "Lorsque Flit démarre sur des pages précises, chaque dossier ou page d’accueil s’ouvre dans un onglet distinct."
"advanced.default_manager" = "Win+E et les dossiers ouverts depuis le bureau ou d’autres programmes s’ouvrent dans Flit. Le Panneau de configuration et les autres dossiers système restent dans l’Explorateur de fichiers. Seuls vos paramètres utilisateur changent. Flit les sauvegarde et les rétablit quand vous désactivez l’option. Désactivez-la avant de supprimer Flit."
"advanced.default_manager_linux" = "Flit devient l’application par défaut pour les dossiers et répond aux demandes du gestionnaire de fichiers de l’environnement de bureau. Les dossiers ouverts depuis le bureau ou d’autres programmes s’ouvrent dans Flit. Seuls vos paramètres utilisateur changent. Flit les sauvegarde et les rétablit quand vous désactivez l’option. Désactivez-la avant de supprimer Flit."
"advanced.quick_access_sync" = "Synchronise l’épinglage des dossiers entre Flit et l’accès rapide de l’Explorateur de fichiers. À l’activation, Flit ajoute à la fin de ses signets les dossiers manquants de l’accès rapide et épingle ses signets dans l’Explorateur. Seuls les dossiers situés sur des lecteurs dotés d’une lettre sont synchronisés. L’ordre reste indépendant."
"updates.check_on_start" = "Flit vérifie les mises à jour une fois par démarrage et vous informe uniquement si une nouvelle version est disponible. Il demande latest.json à GitHub sans envoyer de données sur vous."
"updates.skipped" = "Flit ne propose plus cette version au démarrage. Elle reste accessible avec « Rechercher les mises à jour »."
"advanced.indexing" = "Flit indexe les noms sur tous les lecteurs pour retrouver les fichiers en quelques millisecondes. Quand l’indexation est désactivée, Flit cesse de parcourir les lecteurs en arrière-plan et libère la mémoire de l’index. Ctrl+Maj+F parcourt toujours le dossier ouvert."
"keys" = "Raccourcis qui diffèrent des valeurs par défaut, par identifiant de commande"
"area_color" = "Le choix « Par défaut » suit la couleur d’arrière-plan. Avec une couleur personnalisée, le texte s’adapte pour rester lisible."
"general.mru_tabs" = "Ctrl+Tab parcourt les onglets du plus récent au plus ancien selon leur utilisation. Désactivez cette option pour suivre l’ordre de la barre d’onglets."
"advanced.search_exclusions" = "Masque ces chemins et leur contenu dans les résultats."

