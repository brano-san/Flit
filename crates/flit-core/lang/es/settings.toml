[help]
"general.language" = "Idioma de los menús, cuadros de diálogo, mensajes y fechas. Los registros se mantienen en inglés."
"general.open_in_running" = "Si la opción está desactivada, Flit abre en una ventana nueva las carpetas que se abren desde otra aplicación o desde la línea de comandos."
"general.switch_to_new_tab" = "Si está desactivado, las carpetas abiertas en nuevas pestañas desde la lista, la barra lateral o la página Inicio se abren en segundo plano"
"general.smooth_scroll" = "Anima el desplazamiento de la lista de archivos."
"general.tab_wheel_reversed" = "Girar la rueda hacia abajo sobre la barra de pestañas activa la pestaña anterior."
"general.date_format" = "Cómo se muestran las fechas en la lista, los resultados de búsqueda, el panel de vista previa y los cuadros de diálogo"
"general.home_quick_access" = "Tarjetas de carpetas ancladas y ubicaciones conocidas"
"general.home_drives" = "Unidades con su espacio disponible"
"general.home_tags" = "Una tarjeta por cada etiqueta"
"general.home_recent" = "Archivos y carpetas abiertos recientemente según Windows"
"general.home_recent_linux" = "Archivos abiertos recientemente según la lista del entorno de escritorio"
"general.shell_submenu" = "Los comandos propios de Windows, como «Enviar a» y «Abrir con», pasan a «Mostrar más opciones». Los que añaden programas como 7-Zip o VS Code permanecen en el menú. Shift+clic derecho muestra todos los comandos."
"general.menu_open_tab" = "Para carpetas"
"general.menu_open_window" = "Para carpetas"
"general.menu_copy_path" = "Copia las rutas completas de los elementos seleccionados"
"general.menu_shortcut" = "Crea accesos directos junto a los elementos seleccionados"
"general.menu_link" = "Crea enlaces junto a los elementos seleccionados"
"general.menu_new_folder_with_selection" = "Mueve los elementos seleccionados a una nueva carpeta"
"general.menu_stream" = "Para un solo archivo seleccionado"
"general.menu_panes" = "«Dividir a la derecha», «Dividir hacia abajo», «Abrir en un panel a la derecha» y «Abrir en un panel inferior»"
"general.menu_pin" = "Para carpetas"
"general.menu_terminal" = "Para carpetas y zonas vacías de la lista"
"general.menu_tags" = "Para elementos de unidades NTFS locales"
"general.menu_tags_linux" = "Para elementos de unidades locales"
"general.menu_compress" = "Comandos de archivo comprimido para los elementos seleccionados"
"appearance.background" = "Cada color predefinido tiene un tono claro y otro oscuro. Si se usa un color personalizado, Flit elige texto claro u oscuro y adapta los colores de énfasis para facilitar la lectura."
"appearance.background_image" = "Imagen atenuada detrás de la lista de archivos para que se puedan leer los nombres. Deje el campo vacío para no mostrar ninguna imagen. «Establecer como fondo de Flit» en el menú de una imagen rellena el campo."
"appearance.tab_actions" = "A la izquierda de los botones de la ventana. Da acceso a los comandos de pestaña nueva, ventana nueva, paneles, miniventana y pantalla completa."
"appearance.ops_button" = "A la derecha de la barra de direcciones. Si falla una operación, el botón sigue visible hasta que se abra el panel de operaciones."
"appearance.status_bar" = "La barra de estado aparece al mostrar mensajes. Alt+R muestra el tamaño de las carpetas. Los comandos de la Papelera de reciclaje y de los nombres de archivos comprimidos están en la paleta de comandos."
"appearance.window_title" = "Con «Flit», los botones de la ventana aparecen en la barra de pestañas. Con «Sistema», el gestor de ventanas dibuja la barra de título y el borde, como en KDE Plasma o X11. La opción no está disponible, por ejemplo, en GNOME con Wayland."
"files.dotfiles" = "Archivos cuyo nombre empieza por punto, habituales en Linux y en herramientas de desarrollo."
"files.streams" = "Los flujos de datos NTFS aparecen en filas con el formato «nombre:flujo» y solo se pueden consultar."
"files.hover_select" = "Al dejar el puntero sobre una fila durante 0,6 s, se selecciona la fila."
"files.spring_delay" = "Mientras arrastra elementos, manténgalos durante este tiempo sobre una carpeta, una pestaña, un tramo de la ruta o una sección contraída de la barra lateral para abrir el destino. «Desactivado» impide la apertura automática."
"files.single_click_files" = "Los clics con Ctrl o Shift siguen seleccionando sin abrir."
"files.single_click_folders" = "Los clics con Ctrl o Shift siguen seleccionando sin abrir."
"files.single_click_columns" = "Solo en el diseño Columnas"
"files.folders_in_new_tab" = "Haga doble clic en una carpeta de la lista o selecciónela y pulse Enter para abrirla en una pestaña nueva."
"files.select_previous" = "Al subir un nivel o volver atrás, Flit selecciona la carpeta que acaba de dejar y desplaza la lista hasta que queda visible."
"files.confirm_delete" = "Flit siempre pide confirmación antes de vaciar la Papelera de reciclaje."
"files.warn_extension" = "Pulse Enter de nuevo para aplicar el nuevo nombre."
"files.conflicts" = "Determina qué sucede al copiar o mover un elemento si ya existe otro con el mismo nombre en el destino."
"files.size_units" = "Tamaños en la lista, la barra de estado, el panel de vista previa y el panel de operaciones"
"files.archive_format" = "Formato inicial del comando «Añadir al archivo comprimido…»."
"files.builtin_archives" = "Si la opción está desactivada, los archivos comprimidos se abren en la aplicación predeterminada del sistema, como 7-Zip. Se ocultan los comandos «Comprimir» y «Extraer» de Flit y se desactivan las demás opciones de archivos comprimidos."
"files.builtin_archives_linux" = "Si la opción está desactivada, los archivos comprimidos se abren en la aplicación predeterminada del sistema, como File Roller o Ark. Se ocultan los comandos «Comprimir» y «Extraer» de Flit y se desactivan las demás opciones de archivos comprimidos."
"files.archives_as_folders" = "Si la opción está desactivada, los archivos comprimidos se abren en la aplicación predeterminada del sistema, como 7-Zip. «Abrir como carpeta» sigue mostrando su contenido desde el menú contextual."
"files.archives_as_folders_linux" = "Si la opción está desactivada, los archivos comprimidos se abren en la aplicación predeterminada del sistema, como File Roller o Ark. «Abrir como carpeta» sigue mostrando su contenido desde el menú contextual."
"layout.same_for_all" = "Si la opción está desactivada, Flit guarda el diseño, el orden, la agrupación y las columnas de cada carpeta por separado."
"layout.default_layout" = "Para carpetas sin vista propia. El diseño «Adaptable» no está disponible cuando todas las carpetas comparten una vista."
"layout.default_sort" = "Para carpetas sin vista propia"
"layout.default_descending" = "Para carpetas sin vista propia"
"layout.default_folders" = "Posición de las carpetas al ordenar elementos en carpetas sin vista propia."
"layout.default_group" = "Para carpetas sin vista propia"
"layout.column_modified" = "En el diseño Detalles de las carpetas sin vista propia"
"layout.column_created" = "En el diseño Detalles de las carpetas sin vista propia"
"layout.column_type" = "En el diseño Detalles de las carpetas sin vista propia"
"layout.column_size" = "En el diseño Detalles de las carpetas sin vista propia"
"layout.column_tags" = "En el diseño Detalles de las carpetas sin vista propia"
"layout.auto_fit" = "Ajusta el ancho de las columnas al contenido cada vez que se carga una carpeta."
"advanced.flatten_in_menu" = "Mueve los archivos de todas las subcarpetas a la carpeta seleccionada y elimina las subcarpetas que quedan vacías. Ctrl+Z deshace la operación."
"advanced.log_level" = "%LOCALAPPDATA%\\Flit\\logs; nunca el contenido de archivos ni contraseñas"
"advanced.log_level_linux" = "~/.local/state/flit/logs; nunca el contenido de archivos ni contraseñas"
"general.startup_pages" = "Al abrir páginas concretas al iniciar Flit, cada carpeta o página de inicio se abre en su propia pestaña."
"advanced.default_manager" = "Flit se abre al pulsar Win+E o al abrir carpetas desde el escritorio u otros programas. El Panel de control y las demás carpetas del sistema siguen abriéndose en el Explorador de archivos. Solo cambia su configuración de usuario. Flit guarda la configuración anterior y la restaura al desactivar esta opción. Desactívela antes de eliminar Flit."
"advanced.default_manager_linux" = "Flit pasa a ser la aplicación predeterminada para abrir carpetas y atiende las solicitudes del administrador de archivos del entorno de escritorio. Las carpetas que se abren desde el escritorio u otros programas se muestran en Flit. Solo cambia su configuración de usuario. Flit guarda la configuración anterior y la restaura al desactivar esta opción. Desactívela antes de eliminar Flit."
"advanced.quick_access_sync" = "Sincroniza las carpetas ancladas entre Flit y el Acceso rápido del Explorador de archivos. Al activarla, Flit añade al final de sus marcadores las carpetas del Acceso rápido que le falten y ancla sus propios marcadores en el Explorador. Solo se sincronizan las carpetas de unidades con letra. El orden se mantiene independiente."
"updates.check_on_start" = "Flit busca actualizaciones una vez al iniciar y solo avisa si hay una versión nueva. Para comprobarlo, solicita latest.json a GitHub sin enviar datos sobre usted."
"updates.skipped" = "Esta versión ya no se ofrece al iniciar. Sigue disponible con «Buscar actualizaciones»."
"advanced.indexing" = "Flit indexa los nombres de todas las unidades para encontrar archivos en milisegundos. Si se desactiva la indexación, Flit deja de recorrer las unidades en segundo plano y libera la memoria del índice. Ctrl+Shift+F sigue buscando directamente en la carpeta abierta."
"keys" = "Atajos que difieren de los predeterminados, agrupados por identificador de comando."
"area_color" = "«Predeterminado» sigue el color de fondo. Con un color personalizado, el texto se ajusta para facilitar la lectura."
"general.mru_tabs" = "Ctrl+Tab recorre las pestañas por orden de uso reciente. Desactive esta opción para seguir el orden de la barra de pestañas."
"advanced.search_exclusions" = "Oculta estas rutas y su contenido de los resultados."

